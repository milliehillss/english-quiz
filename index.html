<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мои тесты по английскому</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4eee5;color:#473c32;font:16px Arial;padding:12px}main{max-width:440px;margin:auto}.hero{text-align:center;padding:14px}.hero small{color:#9b8061;font-weight:bold;letter-spacing:1px}h1{font:normal 36px Georgia;margin:10px}.card{background:#f8f3eb;border:1px solid #e6d9c7;border-radius:24px;padding:20px}.dots{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.dot{border:2px solid #e4d7c6;border-radius:50%;width:35px;height:35px;display:grid;place-items:center}.dot.cur{border-color:#9c8161}.dot.ok{background:#e0f3e8;border-color:#27ad78}.dot.bad{background:#fbe7e9;border-color:#e45872}.muted{color:#887a69;font-weight:bold}.sentence{font:24px Georgia;margin:18px 0}.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;border:2px solid #e7d9c6;border-radius:17px;background:#faf6ef;font-size:18px;color:#54483d}.opt.sel{border-color:#a38a6b;background:#f3e9dc}.opt.ok{background:#e0f3e8;border-color:#27ad78}.opt.bad{background:#fbe7e9;border-color:#e45872}.check,.nav button{border:0;border-radius:16px;padding:16px;font-weight:bold;font-size:17px}.check{width:100%;background:#c8b8a5;color:white;margin-top:10px}.nav{display:flex;gap:10px;margin-top:12px}.nav button{flex:1;background:#efe5d7;color:#755d45}.fb{padding:12px;border-radius:15px;margin-top:12px;line-height:1.5}.green{background:#e1f3e8;color:#287446}.red{background:#f9e6e8;color:#a64054}input{width:100%;padding:14px;border:2px solid #e7d9c6;border-radius:14px;background:#faf6ef;font-size:18px;margin:12px 0}
</style>
<main>
<header class="hero"><small>ENGLISH · A2</small><h1>Мои тесты<br>по английскому</h1><div style="color:#887a69">Выбери тест и проверь свои знания</div></header>
<section class="card" id="home"><h2>Доступные тесты</h2><button class="opt" id="futureTest"><strong>Future Simple &amp; Future Continuous</strong><br><small>Выбери правильную форму · 10 вопросов · A2</small></button>
<button class="opt" id="buildTest"><strong>Составь предложения: Future Tenses</strong><br><small>Самостоятельная практика · 8 заданий · A2</small></button></section>
<section class="card" id="start" hidden><h2>Перед началом</h2><p>Введи своё имя, чтобы учитель получил твои ответы.</p><input id="studentName" placeholder="Твоё имя"><button class="check" id="startBtn">Начать тест</button><div id="startFb"></div></section>
<section class="card" id="quiz" hidden><div class="dots" id="dots"></div><div class="muted" id="prog"></div><p class="sentence" id="q"></p><div id="opts"></div><button class="check" id="check">Проверить</button><div id="fb"></div><div class="nav"><button id="back" hidden>← Назад</button><button id="next">Дальше →</button></div></section>
<section class="card" id="buildQuiz" hidden>
<div class="muted" id="buildProgress"></div><p class="sentence" id="buildPrompt"></p><p id="buildHintWords" class="muted"></p>
<input id="buildAnswer" placeholder="Напиши предложение на английском" autocomplete="off">
<button class="check" id="buildCheck">Проверить</button><div id="buildFb"></div>
<div class="nav"><button id="buildNext" disabled>Следующее задание →</button></div>
</section>
<section class="card" id="buildFinish" hidden><h2>Отличная работа!</h2><p id="buildScore"></p><p id="buildSendStatus"></p><button class="check" id="buildAgain">Начать заново</button><button class="check" id="buildHome" style="background:#efe5d7;color:#755d45">К списку тестов</button></section>
<section class="card" id="finish" hidden><h2>Отличная работа!</h2><p id="score"></p><p id="sendStatus"></p><button class="check" onclick="restart()">Начать заново</button></section></main>
<script>
const WEBHOOK = "https://script.google.com/macros/s/AKfycbyTfcFy04_nknCXaI1bhrIi19NRu_jGHfF8IoqnlxBwSLS3vq3kaw62qME0J2dgGcKxAw/exec";
const data=[
["At 8 p.m. tomorrow, I ___ dinner with my family.",["will eat","will be eating","eat"],1,"Подумай: действие будет происходить в процессе в конкретный момент завтра вечером?","Указано конкретное время в будущем, когда действие будет в процессе."],
["I think it ___ sunny tomorrow.",["will be","will being","is being"],0,"Это прогноз о будущем, а не описание действия в процессе.","Для обычного прогноза используем Future Simple."],
["This time next week, they ___ to Spain.",["will fly","will be flying","fly"],1,"Представь действие, которое будет происходить в конкретный момент на следующей неделе.","This time next week указывает на действие в процессе в будущем."],
["Don't worry! I ___ you with your homework.",["will help","will be helping","help"],0,"Это обещание или предложение помощи.","Обещания обычно выражаем с помощью Future Simple."],
["At noon tomorrow, she ___ in her office.",["will work","will be working","works"],1,"В полдень действие будет продолжаться. Какую форму выбираем для процесса?","Для действия в процессе в заданный момент используем Future Continuous."],
["They ___ a new car next month. (prediction)",["will buy","will be buying","are buy"],0,"Это предсказание о событии, без акцента на длительности.","Предсказания часто выражаются Future Simple."],
["At 10 tomorrow morning, we ___ our English test.",["will take","will be taking","take"],1,"Действие будет идти в определённое время завтра утром.","В заданный будущий момент действие будет происходить — Future Continuous."],
["Maybe he ___ late tonight.",["will be","will being","is"],0,"В предложении выражено предположение о будущем.","Предположения о будущем часто используют Future Simple."],
["At this time on Saturday, I ___ football.",["will play","will be playing","played"],1,"This time on Saturday — действие будет в процессе в конкретный момент.","Future Continuous описывает действие в процессе в указанный момент."],
["I promise I ___ your secret.",["will keep","will be keeping","keep"],0,"Это обещание. Какое будущее время часто используют для обещаний?","Обещания выражаем Future Simple: will + начальная форма глагола."]
];
let i=0,sel=-1,score=0,solved=false,student="",states=Array(10).fill("pending"),attempts=Array.from({length:10},()=>[]),finalAnswers=Array(10).fill(null),activeMode="choice";
const buildData=[
["Скажи: «Я позвоню тебе завтра».","I will call you tomorrow.","Используй Future Simple для решения или обещания о будущем."],
["Скажи: «Завтра в 8 вечера я буду заниматься английским».","At 8 p.m. tomorrow, I will be studying English.","Когда действие будет происходить в конкретный момент в будущем, нужна длительная форма."],
["Скажи: «Она навестит бабушку в следующие выходные».","She will visit her grandma next weekend.","Для обычного будущего действия используй конструкцию с will и начальную форму глагола."],
["Скажи: «Завтра в это время они будут ехать в Лондон».","This time tomorrow, they will be travelling to London.","Маркер this time tomorrow показывает, что действие будет в процессе."],
["Скажи: «Мы не будем смотреть телевизор сегодня вечером».","We will not watch TV tonight.","В отрицании Future Simple после will используется not и начальная форма глагола."],
["Спроси: «Ты будешь работать в 6 вечера?»","Will you be working at 6 p.m.?","В вопросе Future Continuous поставь will перед подлежащим; не забудь форму be + глагол-ing."],
["Скажи: «Он поможет нам с проектом».","He will help us with the project.","Обещание или предложение помощи обычно выражаем Future Simple."],
["Скажи: «В полночь я буду спать».","At midnight, I will be sleeping.","At midnight задаёт конкретный момент, когда действие будет продолжаться."]
];
let bi=0,bscore=0,btries=[],banswers=[];
function draw(){document.getElementById("prog").textContent="Задание "+(i+1)+" из 10";document.getElementById("dots").innerHTML=states.map((s,n)=>'<div class="dot '+(n===i?"cur ":"")+(s==="correct"?"ok":s==="wrong"?"bad":"")+'">'+(n+1)+'</div>').join("");document.getElementById("q").textContent=data[i][0];document.getElementById("opts").innerHTML=data[i][1].map((v,n)=>'<button class="opt" onclick="choose('+n+')">'+String.fromCharCode(65+n)+'. '+v+'</button>').join("");document.getElementById("fb").innerHTML="";document.getElementById("back").disabled=true;document.getElementById("next").disabled=true;document.getElementById("check").textContent="Проверить";document.getElementById("check").disabled=false;sel=-1;solved=false}
function choose(n){if(solved)return;sel=n;document.querySelectorAll("#opts .opt").forEach((b,j)=>b.className="opt"+(j===n?" sel":""));document.getElementById("fb").innerHTML=""}
document.getElementById("futureTest").onclick=()=>{activeMode="choice";document.getElementById("home").hidden=true;document.getElementById("start").hidden=false};
document.getElementById("buildTest").onclick=()=>{activeMode="build";document.getElementById("home").hidden=true;document.getElementById("start").hidden=false;document.querySelector("#start h2").textContent="Самостоятельная практика";document.querySelector("#start p").textContent="Введи своё имя, чтобы учитель получил результат.";document.getElementById("startBtn").textContent="Начать задания"};
document.getElementById("startBtn").onclick=()=>{student=document.getElementById("studentName").value.trim();if(!student){document.getElementById("startFb").innerHTML='<div class="fb red">Пожалуйста, введи своё имя.</div>';return}document.getElementById("start").hidden=true;if(activeMode==="build"){bi=0;bscore=0;btries=Array(8).fill(0);banswers=Array(8).fill("");document.getElementById("buildQuiz").hidden=false;drawBuild()}else{document.getElementById("quiz").hidden=false;draw()}};
document.getElementById("check").onclick=()=>{if(sel<0){document.getElementById("fb").innerHTML='<div class="fb red">Сначала выбери ответ.</div>';return}if(solved){advance();return}let choice=data[i][1][sel],correct=data[i][1][data[i][2]];attempts[i].push({selected:choice,isCorrect:sel===data[i][2]});let btn=document.querySelectorAll("#opts .opt")[sel];if(sel===data[i][2]){btn.className="opt ok";states[i]="correct";score++;solved=true;finalAnswers[i]={question:data[i][0],selected:choice,correct:correct,isCorrect:true,attempts:attempts[i].slice()};document.querySelectorAll("#opts .opt").forEach(b=>b.disabled=true);document.getElementById("fb").innerHTML='<div class="fb green">✓ Верно!<br>'+data[i][4]+'</div>';document.getElementById("next").disabled=false;document.getElementById("check").disabled=true;document.getElementById("check").textContent="Ответ принят"}else{btn.className="opt bad";states[i]="wrong";solved=true;finalAnswers[i]={question:data[i][0],selected:choice,correct:correct,isCorrect:false,attempts:attempts[i].slice()};document.querySelectorAll("#opts .opt").forEach((b,j)=>{if(j===data[i][2])b.className="opt ok";b.disabled=true});document.getElementById("fb").innerHTML='<div class="fb red">Не совсем. Правильный ответ: <strong>'+correct+'</strong>.<br>'+data[i][4]+'</div>';document.getElementById("next").disabled=false;document.getElementById("check").textContent="Следующий вопрос";document.getElementById("check").disabled=true}};
function advance(){i++;if(i>=10){document.getElementById("quiz").hidden=true;document.getElementById("finish").hidden=false;document.getElementById("score").textContent="Твой результат: "+score+" из 10.";sendResults();return}draw()}
document.getElementById("next").onclick=()=>{if(solved)advance()};document.getElementById("back").onclick=()=>{};
function normAnswer(v){return v.toLowerCase().trim().replace(/[.!?]+$/,"").replace(/\\s+/g," ").replace(/’/g,"'")}
function drawBuild(){const d=buildData[bi];document.getElementById("buildProgress").textContent="Задание "+(bi+1)+" из 8";document.getElementById("buildPrompt").textContent=d[0];document.getElementById("buildHintWords").textContent="Составь полное предложение на английском языке.";document.getElementById("buildAnswer").value="";document.getElementById("buildAnswer").disabled=false;document.getElementById("buildAnswer").className="";document.getElementById("buildFb").innerHTML="";document.getElementById("buildCheck").disabled=false;document.getElementById("buildNext").disabled=true;document.getElementById("buildNext").textContent=bi===7?"Завершить":"Следующее задание →"}
document.getElementById("buildCheck").onclick=()=>{const val=document.getElementById("buildAnswer").value.trim();if(!val){document.getElementById("buildFb").innerHTML='<div class="fb red">Напиши свой вариант предложения.</div>';return}btries[bi]++;banswers[bi]=val;if(normAnswer(val)===normAnswer(buildData[bi][1])){if(btries[bi]===1)bscore++;document.getElementById("buildAnswer").className="green";document.getElementById("buildAnswer").disabled=true;document.getElementById("buildFb").innerHTML='<div class="fb green">✓ Верно! '+buildData[bi][2]+'</div>';document.getElementById("buildCheck").disabled=true;document.getElementById("buildNext").disabled=false}else{document.getElementById("buildAnswer").className="red";document.getElementById("buildFb").innerHTML='<div class="fb red">Пока не совсем верно. '+buildData[bi][2]+' Проверь порядок слов и форму глагола, затем попробуй ещё раз.</div>';document.getElementById("buildAnswer").focus()}};
document.getElementById("buildNext").onclick=()=>{if(bi<7){bi++;drawBuild()}else{document.getElementById("buildQuiz").hidden=true;document.getElementById("buildFinish").hidden=false;document.getElementById("buildScore").textContent="Правильно с первой попытки: "+bscore+" из 8.";sendBuildResults()}};
async function sendBuildResults(){document.getElementById("buildSendStatus").textContent="Отправляем результат учителю…";const payload={name:student,quiz:"Future Simple & Future Continuous A2 — составь предложения",score:bscore+"/8 с первой попытки",answers:buildData.map((d,n)=>({question:d[0],selected:banswers[n]||"Нет ответа",correct:d[1],isCorrect:n<8&&normAnswer(banswers[n]||"")===normAnswer(d[1]),attempts:btries[n]}))};try{await fetch(WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});document.getElementById("buildSendStatus").textContent="Результат отправлен учителю!";}catch(e){document.getElementById("buildSendStatus").textContent="Не удалось отправить результат. Попробуй позже.";}}
document.getElementById("buildAgain").onclick=()=>{bi=0;bscore=0;btries=Array(8).fill(0);banswers=Array(8).fill("");document.getElementById("buildFinish").hidden=true;document.getElementById("buildQuiz").hidden=false;drawBuild()};
document.getElementById("buildHome").onclick=()=>{document.getElementById("buildFinish").hidden=true;document.getElementById("home").hidden=false;document.getElementById("start").hidden=true;document.querySelector("#start h2").textContent="Перед началом";document.querySelector("#start p").textContent="Введи своё имя, чтобы учитель получил твои ответы.";document.getElementById("startBtn").textContent="Начать тест"};
async function sendResults(){document.getElementById("sendStatus").textContent="Отправляем ответы учителю…";let payload={name:student,quiz:"Future Simple & Future Continuous A2",score:score+"/10",answers:finalAnswers.map((a,n)=>a||{question:data[n][0],selected:"Нет ответа",correct:data[n][1][data[n][2]],isCorrect:false,attempts:attempts[n]})};try{await fetch(WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});document.getElementById("sendStatus").textContent="Ответы отправлены учителю!";}catch(e){document.getElementById("sendStatus").textContent="Не удалось отправить результат. Попробуй позже.";}}
function restart(){i=0;score=0;states=Array(10).fill("pending");attempts=Array.from({length:10},()=>[]);finalAnswers=Array(10).fill(null);document.getElementById("finish").hidden=true;document.getElementById("start").hidden=false;document.getElementById("studentName").value="";document.getElementById("quiz").hidden=true;document.getElementById("startFb").innerHTML=""}
</script></html>
