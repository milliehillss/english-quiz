<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Tenses A2</title><style>*{box-sizing:border-box}body{margin:0;background:#f4eee5;color:#473c32;font:16px Arial;padding:12px}main{max-width:440px;margin:auto}.hero{text-align:center;padding:14px}.hero small{color:#9b8061;font-weight:bold;letter-spacing:1px}h1{font:normal 36px Georgia;margin:10px}.card{background:#f8f3eb;border:1px solid #e6d9c7;border-radius:24px;padding:20px}.dots{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.dot{border:2px solid #e4d7c6;border-radius:50%;width:35px;height:35px;display:grid;place-items:center}.dot.cur{border-color:#9c8161}.dot.ok{background:#e0f3e8;border-color:#27ad78}.dot.bad{background:#fbe7e9;border-color:#e45872}.muted{color:#887a69;font-weight:bold}.sentence{font:24px Georgia;margin:18px 0}.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;border:2px solid #e7d9c6;border-radius:17px;background:#faf6ef;font-size:18px;color:#54483d}.opt.sel{border-color:#a38a6b;background:#f3e9dc}.opt.ok{background:#e0f3e8;border-color:#27ad78}.opt.bad{background:#fbe7e9;border-color:#e45872}.check,.nav button{border:0;border-radius:16px;padding:16px;font-weight:bold;font-size:17px}.check{width:100%;background:#c8b8a5;color:white;margin-top:10px}.nav{display:flex;gap:10px;margin-top:12px}.nav button{flex:1;background:#efe5d7;color:#755d45}.fb{padding:12px;border-radius:15px;margin-top:12px;line-height:1.5}.green{background:#e1f3e8;color:#287446}.red{background:#f9e6e8;color:#a64054}</style><main><header class="hero"><small>ENGLISH · A2</small><h1>Future Simple<br>&amp; Future Continuous</h1><div style="color:#887a69">будущее простое и длительное</div></header><section class="card" id="quiz"><div class="dots" id="dots"></div><div class="muted" id="prog"></div><p class="sentence" id="q"></p><div id="opts"></div><button class="check" id="check">Проверить</button><div id="fb"></div><div class="nav"><button id="back">← Назад</button><button id="next">Дальше →</button></div></section><section class="card" id="finish" hidden><h2>Отличная работа!</h2><p id="score"></p><button class="check" onclick="restart()">Начать заново</button></section></main><script>
const data=[
["At 8 p.m. tomorrow, I ___ dinner with my family.",["will eat","will be eating","eat"],1,"Подумай: действие будет происходить в процессе в конкретный момент завтра вечером?","Указано конкретное время в будущем, когда действие будет в процессе."],
["I think it ___ sunny tomorrow.",["will be","will being","is being"],0,"Это прогноз о будущем, а не описание действия в процессе.","Для обычного прогноза используем Future Simple."],
["This time next week, they ___ to Spain.",["will fly","will be flying","fly"],1,"Представь действие, которое будет происходить в конкретный момент на следующей неделе.","This time next week указывает на действие в процессе в будущем."],
["Don't worry! I ___ you with your homework.",["will help","will be helping","help"],0,"Это обещание или предложение помощи.","Обещания обычно выражаем с помощью Future Simple."],
["At noon tomorrow, she ___ in her office.",["will work","will be working","works"],1,"В полдень действие будет продолжаться. Какую форму выбираем для процесса?","Для действия в процессе в заданный момент используем Future Continuous."],
["They ___ a new car next month. (prediction)",["will buy","will be buying","are buy"],0,"Это предсказание о событии, без акцента на длительности.","Предсказания часто выражаются Future Simple."],
["At 10 tomorrow morning, we ___ our English test.",["will take","will be taking","take"],1,"Действие будет идти в определённое время завтра утром.","В заданный будущий момент действие будет происходить — Future Continuous."],
["Maybe he ___ late tonight.",["will be","will being","is"],0,"В предложении выражено предположение о будущем.","Предположения о будущем часто используют Future Simple."],
["At this time on Saturday, I ___ football.",["will play","will be playing","played"],1,"This time on Saturday — действие будет в процессе в конкретный момент.","Future Continuous описывает действие в процессе в указанный момент."],
["I promise I ___ your secret.",["will keep","will be keeping","keep"],0,"Это обещание. Какое будущее время часто используют для обещаний?","Обещания выражаем Future Simple: will + начальная форма глагола."]
];
let i=0,sel=-1,score=0,solved=false,states=Array(10).fill("pending");
function draw(){document.getElementById("prog").textContent="Задание "+(i+1)+" из 10";document.getElementById("dots").innerHTML=states.map((s,n)=>'<div class="dot '+(n===i?"cur ":"")+(s==="correct"?"ok":s==="wrong"?"bad":"")+'">'+(n+1)+'</div>').join("");document.getElementById("q").textContent=data[i][0];document.getElementById("opts").innerHTML=data[i][1].map((v,n)=>'<button class="opt" onclick="choose('+n+')">'+String.fromCharCode(65+n)+'. '+v+'</button>').join("");document.getElementById("fb").innerHTML="";document.getElementById("back").disabled=i===0;document.getElementById("next").disabled=true;document.getElementById("check").textContent="Проверить";sel=-1;solved=false}
function choose(n){if(solved)return;sel=n;document.querySelectorAll(".opt").forEach((b,j)=>b.className="opt"+(j===n?" sel":""));document.getElementById("fb").innerHTML=""}
document.getElementById("check").onclick=()=>{if(sel<0){document.getElementById("fb").innerHTML='<div class="fb red">Сначала выбери ответ.</div>';return}if(solved){advance();return}let btn=document.querySelectorAll(".opt")[sel];if(sel===data[i][2]){btn.className="opt ok";states[i]="correct";score++;solved=true;document.getElementById("fb").innerHTML='<div class="fb green">✓ Верно!<br>'+data[i][4]+'</div>';document.getElementById("next").disabled=false;document.getElementById("check").textContent="Следующий вопрос"}else{btn.className="opt bad";states[i]="wrong";document.getElementById("fb").innerHTML='<div class="fb red">Не совсем! '+data[i][3]+' Попробуй ещё раз.</div>';sel=-1}};
function advance(){i++;if(i>=10){document.getElementById("quiz").hidden=true;document.getElementById("finish").hidden=false;document.getElementById("score").textContent="Твой результат: "+score+" из 10.";return}draw()}
document.getElementById("next").onclick=()=>{if(solved)advance()};document.getElementById("back").onclick=()=>{if(i>0){i--;draw()}};function restart(){i=0;score=0;states=Array(10).fill("pending");document.getElementById("finish").hidden=true;document.getElementById("quiz").hidden=false;draw()}draw();
</script></html>
